name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: usai_test
          MYSQL_USER: usai
          MYSQL_PASSWORD: usai
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uusai -pusai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://usai:usai@127.0.0.1:3306/usai_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Falha o CI se uma dependência que vai para produção tiver falha de segurança conhecida (nível alto ou pior).
      # As ferramentas de teste e lint (devDependencies) ficam de fora: não vão para o servidor.
      - name: Auditoria de segurança das dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace=apps/backend

      - name: Lint
        run: npx eslint apps/backend/src apps/backend/tests --ext .ts

      - name: Testes com cobertura
        run: npm run test:backend

      - name: Build
        run: npm run build:backend

  frontend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npx eslint apps/frontend/src --ext .ts,.tsx

      - name: Testes com cobertura
        run: npm run test:frontend

      - name: Build
        run: npm run build:frontend

  sonarcloud:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: usai_test
          MYSQL_USER: usai
          MYSQL_PASSWORD: usai
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uusai -pusai"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://usai:usai@127.0.0.1:3306/usai_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate --workspace=apps/backend

      - name: Cobertura do backend
        run: npm run test:backend

      - name: Cobertura do frontend
        run: npm run test:frontend

      - name: Análise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
