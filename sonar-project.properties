sonar.projectKey=gustavovieiira_TCC-USAI2.0
sonar.organization=gustavovieiira
sonar.projectName=USAI 2.0

sonar.sources=apps/backend/src,apps/frontend/src
sonar.tests=apps/backend/tests,apps/frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# server.ts e main.tsx só ligam o servidor e o React (efeitos colaterais de inicialização); a lógica fica nos módulos testados.
sonar.coverage.exclusions=apps/backend/src/server.ts,apps/frontend/src/main.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/prisma/migrations/**

sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info
